[build]
  command = "cd frontend && npm install && npm run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS    = "--legacy-peer-deps"

# SPA catch-all — React Router handles routing client-side
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
