<title>Meadow Mage</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
/* layout: full-bleed 3D canvas, spell bar pinned top-centre, two utility buttons right, joystick + hint float over play area */
:root{--bg:#0d1326;--panel:rgba(13,19,38,.58);--line:rgba(236,228,205,.26);--ink:#f3ecd8;--dim:rgba(243,236,216,.62);--spell:#ff6a1a;color-scheme:dark;
--ui:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--ui);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;background:var(--ink);z-index:3}
#bar{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));display:flex;gap:7px;z-index:5}
#bar button{position:relative;width:min(44px,calc((100vw - 110px)/7));aspect-ratio:1;padding:3px;box-sizing:border-box;border:2px solid #b8923f;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3a3326,#14110c);cursor:pointer;transition:transform .12s,box-shadow .12s;box-shadow:0 2px 6px rgba(0,0,0,.5)}
#bar button canvas{width:100%;height:100%;display:block}
#bar button b{position:absolute;left:50%;bottom:-13px;transform:translateX(-50%);font:700 9px Georgia,serif;color:var(--ink);text-shadow:0 1px 3px #000}
#bar button.on{border-color:var(--spell);box-shadow:0 0 14px var(--spell),inset 0 0 10px rgba(255,255,255,.12);transform:scale(1.14)}
#bar button:focus-visible,#side button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#side{position:fixed;right:calc(8px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px;z-index:5}
#side button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:400 18px var(--ui);cursor:pointer}
#name{position:fixed;top:calc(68px + env(safe-area-inset-top,0px));left:calc(14px + env(safe-area-inset-left,0px));font:400 11px Georgia,'Times New Roman',serif;letter-spacing:.32em;text-transform:uppercase;color:var(--ink);text-shadow:0 1px 6px rgba(0,0,0,.8);pointer-events:none;z-index:4;white-space:nowrap}
#joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid var(--line);background:rgba(13,19,38,.25);pointer-events:none;z-index:4}
#joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:rgba(243,236,216,.55)}
#hint{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:8px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font:400 13px/1.4 var(--ui);color:var(--ink);text-align:center;pointer-events:none;z-index:4;transition:opacity 1.2s;max-width:calc(100vw - 48px)}
@media (prefers-reduced-motion:reduce){#bar button{transition:none}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{'use strict';
const T=THREE,PI=Math.PI,TAU=PI*2;
const rand=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x)};
const eback=t=>{t=clamp(t,0,1);const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
let seed=20251;const sr=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296},srr=(a,b)=>a+sr()*(b-a);
const hash=(x,y)=>{const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s)};
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);return lerp(lerp(hash(xi,yi),hash(xi+1,yi),u),lerp(hash(xi,yi+1),hash(xi+1,yi+1),u),v)}
const cv=s=>{const c=document.createElement('canvas');c.width=c.height=s;return c};
const MOBILE=matchMedia('(pointer:coarse)').matches;
const AREA=120;
let now=0;

/* ---------- renderer ---------- */
const canvas=document.getElementById('c');
const renderer=new T.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
let PR=Math.min(window.devicePixelRatio||1,2);
renderer.setPixelRatio(PR);
renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();const FOGC=new T.Color(.66,.76,.93),FOGBASE=FOGC.clone(),TOPBASE=new T.Color(.16,.36,.80),STORMC=new T.Color(.40,.34,.48),STORMT=new T.Color(.28,.26,.40);scene.fog=new T.FogExp2(FOGC,.0082);let storm=0,stormUntil=0;
const camera=new T.PerspectiveCamera(70,1,.05,1200);camera.rotation.order='YXZ';scene.add(camera);
const U={time:{value:0},fx:{value:null},det:{value:null},gust:{value:new T.Vector4(0,0,0,-1)},gustT:{value:0},gustA:{value:0},pl:{value:new T.Vector2()},pscale:{value:500}};


/* ---------- post: HDR bloom, vignette, tone map ---------- */
const post=(()=>{const gl=renderer.getContext();if(!renderer.capabilities.isWebGL2)return null;const f32=gl.getExtension('EXT_color_buffer_float');if(!f32&&!gl.getExtension('EXT_color_buffer_half_float'))return null;
const P={type:T.HalfFloatType,format:T.RGBAFormat,minFilter:T.LinearFilter,magFilter:T.LinearFilter,generateMipmaps:false},MS=f32&&T.WebGLMultisampleRenderTarget;
const scn=MS?new MS(4,4,Object.assign({depthBuffer:true},P)):new T.WebGLRenderTarget(4,4,Object.assign({depthBuffer:true},P));if(MS)scn.samples=MOBILE?2:4;
const L=5,lv=[];for(let i=0;i<L;i++)lv.push(new T.WebGLRenderTarget(4,4,Object.assign({depthBuffer:false},P)));
const quad=new T.Mesh(new T.PlaneGeometry(2,2),null);quad.frustumCulled=false;const qs=new T.Scene();qs.add(quad);const oc=new T.OrthographicCamera(-1,1,1,-1,0,1);
const vs='varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}';
const mk=(fs,u,add)=>{const m=new T.ShaderMaterial({uniforms:u,vertexShader:vs,fragmentShader:fs,depthTest:false,depthWrite:false});if(add){m.blending=T.CustomBlending;m.blendEquation=T.AddEquation;m.blendSrc=T.OneFactor;m.blendDst=T.OneFactor}return m};
const tx=()=>({value:new T.Vector2()});
const pre=mk('uniform sampler2D tex;uniform vec2 tx;varying vec2 vUv;vec3 s(vec2 o){vec3 c=texture2D(tex,vUv+o*tx).rgb;float b=max(c.r,max(c.g,c.b));float so=clamp(b-.9+.5,0.,1.);so=so*so/2.;return c*max(so,b-.9)/max(b,1e-4);}void main(){vec3 c=(s(vec2(-1.,-1.))+s(vec2(1.,-1.))+s(vec2(-1.,1.))+s(vec2(1.,1.)))*.25;gl_FragColor=vec4(min(c,vec3(24.)),1.);}',{tex:{value:null},tx:tx()});
const down=mk('uniform sampler2D tex;uniform vec2 tx;varying vec2 vUv;void main(){vec3 c=texture2D(tex,vUv).rgb*4.+texture2D(tex,vUv+vec2(-1.,-1.)*tx).rgb+texture2D(tex,vUv+vec2(1.,-1.)*tx).rgb+texture2D(tex,vUv+vec2(-1.,1.)*tx).rgb+texture2D(tex,vUv+vec2(1.,1.)*tx).rgb;gl_FragColor=vec4(c/8.,1.);}',{tex:{value:null},tx:tx()});
const up=mk('uniform sampler2D tex;uniform vec2 tx;varying vec2 vUv;void main(){vec3 c=(texture2D(tex,vUv+vec2(-1.,0.)*tx).rgb+texture2D(tex,vUv+vec2(1.,0.)*tx).rgb+texture2D(tex,vUv+vec2(0.,-1.)*tx).rgb+texture2D(tex,vUv+vec2(0.,1.)*tx).rgb)*2.+texture2D(tex,vUv+vec2(-1.,-1.)*tx).rgb+texture2D(tex,vUv+vec2(1.,-1.)*tx).rgb+texture2D(tex,vUv+vec2(-1.,1.)*tx).rgb+texture2D(tex,vUv+vec2(1.,1.)*tx).rgb;gl_FragColor=vec4(c/12.*.85,1.);}',{tex:{value:null},tx:tx()},true);
const comp=mk('uniform sampler2D tS;uniform sampler2D tB;uniform float uB;varying vec2 vUv;void main(){vec3 c=texture2D(tS,vUv).rgb+texture2D(tB,vUv).rgb*uB;vec2 q=vUv-.5;c*=1.-dot(q,q)*.5;gl_FragColor=vec4(c,1.);\n#include <tonemapping_fragment>\n#include <encodings_fragment>\n}',{tS:{value:scn.texture},tB:{value:lv[0].texture},uB:{value:.6}});
const pass=(m,src,dst,sw,sh)=>{quad.material=m;m.uniforms.tex.value=src.texture;m.uniforms.tx.value.set(1/src.width,1/src.height);renderer.setRenderTarget(dst);renderer.render(qs,oc)};
renderer.autoClear=false;
return{resize(){const v=new T.Vector2();renderer.getDrawingBufferSize(v);const w=Math.max(8,v.x|0),h=Math.max(8,v.y|0);scn.setSize(w,h);lv.forEach((r,i)=>r.setSize(Math.max(2,w>>(i+1)),Math.max(2,h>>(i+1))))},
render(){renderer.setRenderTarget(scn);renderer.clear();renderer.render(scene,camera);
pass(pre,scn,lv[0]);for(let i=0;i<L-1;i++)pass(down,lv[i],lv[i+1]);for(let i=L-2;i>=0;i--)pass(up,lv[i+1],lv[i]);
quad.material=comp;renderer.setRenderTarget(null);renderer.render(qs,oc)}}})();

/* ---------- light + sky ---------- */
const SUN=new T.Vector3(-.62,.40,.45).normalize(),SM=MOBILE?1536:2048,LR=new T.Vector3(0,1,0).cross(SUN).normalize(),LU=SUN.clone().cross(LR).normalize();
const hemi=new T.HemisphereLight(new T.Color(.55,.72,1),new T.Color(.40,.36,.20),.82);scene.add(hemi);
const sun=new T.DirectionalLight(new T.Color(1,.88,.68),1.85);sun.castShadow=true;sun.shadow.mapSize.set(SM,SM);
{const s=sun.shadow.camera;s.left=-46;s.right=46;s.top=46;s.bottom=-46;s.near=1;s.far=240;sun.shadow.bias=-.0005;sun.shadow.normalBias=.05}
scene.add(sun,sun.target);
const flashL=new T.PointLight(0xffffff,0,70,2);scene.add(flashL);let flI=0,flD=1,flT=0;
const sky=new T.Mesh(new T.SphereGeometry(900,24,12),new T.ShaderMaterial({side:T.BackSide,depthWrite:false,fog:false,uniforms:{uSun:{value:SUN},uH:{value:FOGC},uT:{value:TOPBASE.clone()},uK:{value:1}},
vertexShader:'varying vec3 vD;void main(){vD=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
fragmentShader:`varying vec3 vD;uniform vec3 uSun;uniform vec3 uH;uniform vec3 uT;uniform float uK;void main(){vec3 d=normalize(vD);float h=clamp(d.y,0.,1.);
vec3 col=mix(uH,uT,pow(h,.5));float s=max(dot(d,uSun),0.);
col+=(vec3(1.,.72,.42)*pow(s,5.)*.30+vec3(1.,.9,.7)*pow(s,60.)*.5+vec3(1.,.96,.85)*smoothstep(.9992,.9996,s)*8.)*uK;
gl_FragColor=vec4(col,1.);
#include <tonemapping_fragment>
#include <encodings_fragment>
}`}));
scene.add(sky);

/* ---------- geometry helpers ---------- */
const _m4=new T.Matrix4(),_e=new T.Euler(),_q=new T.Quaternion(),_p=new T.Vector3(),_s=new T.Vector3(),_c=new T.Color();
function part(g,c,x=0,y=0,z=0,rx=0,ry=0,rz=0,sx=1,sy=1,sz=1){if(g.index)g=g.toNonIndexed();
g.applyMatrix4(_m4.compose(new T.Vector3(x,y,z),new T.Quaternion().setFromEuler(new T.Euler(rx,ry,rz)),new T.Vector3(sx,sy,sz)));
if(!g.attributes.color){const n=g.attributes.position.count,a=new Float32Array(n*3);for(let i=0;i<n;i++){a[i*3]=c[0];a[i*3+1]=c[1];a[i*3+2]=c[2]}g.setAttribute('color',new T.BufferAttribute(a,3))}return g}
function merge(gs){let n=0;for(const g of gs)n+=g.attributes.position.count;const P=new Float32Array(n*3),N=new Float32Array(n*3),C=new Float32Array(n*3);let o=0;
for(const g of gs){P.set(g.attributes.position.array,o);N.set(g.attributes.normal.array,o);C.set(g.attributes.color.array,o);o+=g.attributes.position.count*3}
const out=new T.BufferGeometry();out.setAttribute('position',new T.BufferAttribute(P,3));out.setAttribute('normal',new T.BufferAttribute(N,3));out.setAttribute('color',new T.BufferAttribute(C,3));return out}
function blob(r,ph,cLo,cHi,det){const g=new T.IcosahedronGeometry(1,det===undefined?2:det),p=g.attributes.position,nr=g.attributes.normal,n=p.count,col=new Float32Array(n*3);
for(let i=0;i<n;i++){let x=p.getX(i),y=p.getY(i),z=p.getZ(i);const l=Math.hypot(x,y,z);x/=l;y/=l;z/=l;const d=r*(1+.13*Math.sin(x*4+ph)+.1*Math.sin(y*5+z*3+ph*2)+.07*Math.sin(z*7+ph*3));
p.setXYZ(i,x*d,y*d*.86,z*d);nr.setXYZ(i,x,y,z);const k=clamp(y*.5+.5+.12*Math.sin(x*9+z*7+ph),0,1);col[i*3]=lerp(cLo[0],cHi[0],k);col[i*3+1]=lerp(cLo[1],cHi[1],k);col[i*3+2]=lerp(cLo[2],cHi[2],k)}
g.setAttribute('color',new T.BufferAttribute(col,3));return g}
const tex=(c,o)=>{const t=new T.CanvasTexture(c);Object.assign(t,o||{});return t};
const vcMat=new T.MeshLambertMaterial({vertexColors:true});

/* ---------- terrain ---------- */
function H(x,z){const r2=x*x+z*z;if(r2<3600)return 0;const k=sstep(60,135,Math.sqrt(r2));return k*(15+9*Math.sin(x*.043+1.3)*Math.cos(z*.051)+5*Math.sin(x*.09+z*.07))}
const TOWER=[-4,-16],COT=[17,-8],MILL=[-17,-12],RUIN=[14,-40];
const PATHS=[[[2,13],[0,3],[-3,-6],[-4,-12.2]],[[0,3],[8,1],[14,-2],[17,-4.6]],[[0,3],[-8,-2],[-14.6,-9.6]],[[-3,-6],[5,-18],[11,-30]]];
function pathDist(x,z){let m=1e9;for(const p of PATHS)for(let i=0;i<p.length-1;i++){const ax=p[i][0],az=p[i][1],bx=p[i+1][0]-ax,bz=p[i+1][1]-az,t=clamp(((x-ax)*bx+(z-az)*bz)/(bx*bx+bz*bz),0,1),d=Math.hypot(x-ax-bx*t,z-az-bz*t);if(d<m)m=d}return m}
// effect map: R burn, G growth, B frost
const FS=512,fxC=cv(FS),fctx=fxC.getContext('2d');fctx.fillStyle='#000';fctx.fillRect(0,0,FS,FS);
const fxTex=tex(fxC,{flipY:false,minFilter:T.LinearFilter,generateMipmaps:false});U.fx.value=fxTex;
function stamp(x,z,r,kind,a){const px=(x/AREA+.5)*FS,py=(z/AREA+.5)*FS,pr=r/AREA*FS;let g;
if(kind!==2){g=fctx.createRadialGradient(px,py,0,px,py,pr);const k=kind===0?'255,0,0':'0,255,0';g.addColorStop(0,`rgb(${k})`);g.addColorStop(.55,`rgb(${k})`);g.addColorStop(1,'rgb(255,255,255)');fctx.globalCompositeOperation='multiply';fctx.fillStyle=g;fctx.fillRect(px-pr,py-pr,pr*2,pr*2)}
const k=['255,0,0','0,255,0','0,0,255'][kind];g=fctx.createRadialGradient(px,py,0,px,py,pr);g.addColorStop(0,`rgba(${k},${a})`);g.addColorStop(.55,`rgba(${k},${a*.85})`);g.addColorStop(1,`rgba(${k},0)`);
fctx.globalCompositeOperation='lighter';fctx.fillStyle=g;fctx.fillRect(px-pr,py-pr,pr*2,pr*2);fxTex.needsUpdate=true}
function burn(x,z,r){stamp(x,z,r,0,1);for(let i=0;i<5;i++){const a=rand(TAU),d=r*rand(.45,.8);stamp(x+Math.cos(a)*d,z+Math.sin(a)*d,r*rand(.3,.5),0,.9)}killFlowers(x,z,r*.8)}
// ground detail (multiplier map, 128 = neutral)
{const S=1024,c=cv(S),g=c.getContext('2d'),im=g.createImageData(S,S),d=im.data;
for(let y=0;y<S;y++)for(let x=0;x<S;x++){const n=vnoise(x*.018,y*.018)*.55+vnoise(x*.07,y*.07)*.3+Math.random()*.15,v=128+(n-.5)*90,o=(y*S+x)*4,dry=vnoise(x*.006+9,y*.006+4);
d[o]=v*(1+sstep(.55,.8,dry)*.5);d[o+1]=v;d[o+2]=v*(1-sstep(.55,.8,dry)*.2);d[o+3]=255}
g.putImageData(im,0,0);const P=(x,z)=>[(x/AREA+.5)*S,(z/AREA+.5)*S];g.lineCap=g.lineJoin='round';
for(const pass of[[20,.35],[11,.8]]){g.strokeStyle=`rgba(255,96,170,${pass[1]})`;g.lineWidth=pass[0];for(const p of PATHS){g.beginPath();p.forEach((q,i)=>{const[a,b]=P(q[0],q[1]);i?g.lineTo(a,b):g.moveTo(a,b)});g.stroke()}}
g.fillStyle='rgba(255,100,170,.55)';for(const[q,r]of[[TOWER,5],[COT,5.5],[MILL,4.2]]){const[a,b]=P(q[0],q[1]);g.beginPath();g.arc(a,b,r/AREA*S,0,TAU);g.fill()}
U.det.value=tex(c,{flipY:false,anisotropy:4})}
{const g=new T.PlaneGeometry(520,520,150,150);g.rotateX(-PI/2);const p=g.attributes.position,col=new Float32Array(p.count*3);
for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i),h=H(x,z);p.setY(i,h);const n=vnoise(x*.03+5,z*.03),k=sstep(0,22,h);
col[i*3]=lerp(.115+n*.05,.10,k);col[i*3+1]=lerp(.27+n*.07,.22+n*.05,k);col[i*3+2]=lerp(.06,.10,k)}
g.setAttribute('color',new T.BufferAttribute(col,3));g.computeVertexNormals();
const m=new T.MeshLambertMaterial({vertexColors:true});
m.onBeforeCompile=sh=>{sh.uniforms.uFx=U.fx;sh.uniforms.uDet=U.det;
sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nvarying vec2 vW;').replace('#include <begin_vertex>','#include <begin_vertex>\nvW=position.xz;');
sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\nvarying vec2 vW;uniform sampler2D uFx;uniform sampler2D uDet;').replace('#include <color_fragment>',`#include <color_fragment>
vec2 guv=vW/120.+.5;vec4 fx=texture2D(uFx,guv);float inA=smoothstep(60.,53.,max(abs(vW.x),abs(vW.y)));
diffuseColor.rgb*=mix(vec3(1.),texture2D(uDet,guv).rgb*2.,inA);
diffuseColor.rgb=mix(diffuseColor.rgb,vec3(.028,.022,.018),fx.r*(1.-fx.g)*.94*inA);
diffuseColor.rgb=mix(diffuseColor.rgb,diffuseColor.rgb*vec3(.85,1.3,.7),fx.g*.5*inA);
diffuseColor.rgb=mix(diffuseColor.rgb,vec3(.72,.88,1.),fx.b*.8*inA);`)};
const mesh=new T.Mesh(g,m);mesh.receiveShadow=true;scene.add(mesh)}

/* ---------- grass ---------- */
const inStruct=(x,z)=>Math.hypot(x-TOWER[0],z-TOWER[1])<3.95||(Math.abs(x-COT[0])<3.7&&Math.abs(z-COT[1])<3)||Math.hypot(x-MILL[0],z-MILL[1])<3.1;
{const N=MOBILE?85000:105000,pos=new Float32Array(N*15),col=new Float32Array(N*15),nor=new Float32Array(N*15),root=new Float32Array(N*15),idx=new Uint32Array(N*9);let n=0;
while(n<N){const a=sr()*TAU,r=58.5*Math.pow(sr(),.56),x=Math.cos(a)*r,z=Math.sin(a)*r;if(inStruct(x,z)||pathDist(x,z)<.75)continue;
const pn=vnoise(x*.12,z*.12),h=srr(.32,.72)*(.8+pn*.5),w=srr(.045,.075),yaw=sr()*TAU,cx=Math.cos(yaw),cz=Math.sin(yaw),la=sr()*TAU,ln=srr(0,.22),lx=Math.cos(la)*ln,lz=Math.sin(la)*ln;
const dry=sstep(.5,.85,vnoise(x*.05+7,z*.05+2)),v=srr(.8,1.15),b=[.05*v,.2*v,.03*v],t=[lerp(.24,.46,dry)*v,lerp(.66,.52,dry)*v,lerp(.10,.14,dry)*v],o=n*15;
const vs=[[-w,0,0],[w,0,0],[-w*.7,.5,.25],[w*.7,.5,.25],[0,1,1]];
for(let k=0;k<5;k++){const q=vs[k],j=o+k*3,tt=q[1];pos[j]=x+cx*q[0]+lx*q[2];pos[j+1]=h*tt;pos[j+2]=z+cz*q[0]+lz*q[2];nor[j+1]=1;root[j]=x;root[j+1]=z;root[j+2]=tt;
